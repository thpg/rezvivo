name: Publication checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned local scanner
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Check publication inputs and decoded metadata
        run: python3 tools/check-publication.py --gitleaks "$RUNNER_TEMP/gitleaks"
      - name: Check Git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner'
